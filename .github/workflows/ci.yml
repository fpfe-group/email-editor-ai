name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: 安装依赖
        run: npm ci
      
      - name: 类型检查
        run: npm run typecheck
      
      - name: 运行测试
        run: npm test -- --run
      
      - name: 构建
        run: npm run build
